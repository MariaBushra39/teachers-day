<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EE">
<title>Happy Teachers’ Day, Ma’am Aysha Bibi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FBF6EE; --blush:#F3DDD9; --blush-deep:#F7E8E4; --rose:#B87682; --rose-deep:#8A4455;
  --gold:#C2A36B; --gold-text:#7D5F2A; --ink:#3B2A2D; --paper:#FFFCF7;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --script:"Great Vibes","Snell Roundhand","Apple Chancery",cursive;
  --cw:min(76vw,340px,calc((100svh - 200px) * .72));
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--sans);color:var(--ink);background-color:var(--ivory);
  background-image:radial-gradient(circle at 12% 8%,rgba(243,221,217,.75),transparent 45%),radial-gradient(circle at 90% 92%,rgba(236,220,190,.55),transparent 48%);
  transition:background-color 1s ease;-webkit-font-smoothing:antialiased;
}
body[data-screen="4"]{background-color:var(--blush-deep)}
body[data-screen="5"]{background-color:#FDF3E4}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1:focus{outline:none}
:focus-visible{outline:3px solid var(--rose-deep);outline-offset:3px;box-shadow:0 0 0 6px rgba(255,249,243,.9)}

/* floating petals */
.petals{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.petals.extra{opacity:0;transition:opacity 2s ease}
body[data-screen="5"] .petals.extra{opacity:1}
.petal{position:absolute;top:0;left:var(--x);width:var(--s);height:calc(var(--s)*1.35);border-radius:80% 0 80% 0;
  background:linear-gradient(135deg,#F7DADA,#E0A2AC);opacity:var(--o);animation:fall var(--dur) linear var(--del) infinite;will-change:transform}
@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0)}50%{transform:translate3d(var(--sway),52vh,0) rotate(190deg)}100%{transform:translate3d(0,112vh,0) rotate(380deg)}}
.spark{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);animation:twinkle var(--dur) ease-in-out var(--del) infinite}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.75;transform:scale(1.1)}}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:center;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;pointer-events:none}
.progress{display:flex;align-items:center;gap:10px;color:var(--gold-text);font-size:.8125rem;letter-spacing:.06em}
.dots{display:flex;gap:7px;align-items:center}
.dots i{display:block;width:8px;height:8px;border-radius:99px;background:rgba(194,163,107,.4);transition:width .5s ease,background-color .5s ease}
.dots i.on{width:24px;background:var(--rose-deep)}
.music{position:absolute;right:max(12px,env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));pointer-events:auto;
  min-height:44px;padding:0 16px;border-radius:99px;border:1px solid rgba(194,163,107,.7);background:rgba(255,252,247,.85);
  color:var(--rose-deep);font:500 .875rem var(--sans);cursor:pointer}

/* screens */
.screen{position:fixed;inset:0;z-index:1;display:flex;overflow-y:auto;overflow-x:hidden;
  padding:calc(64px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.screen.is-active{opacity:1;visibility:visible;transition-delay:0s}
.inner{position:relative;isolation:isolate;margin:auto;width:100%;max-width:34rem;text-align:center}
.rise{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
.is-active .rise{opacity:1;transform:none;transition-delay:var(--d,0ms)}

.panel{position:relative;padding:clamp(1.8rem,6vw,3rem) clamp(1.4rem,5.5vw,2.6rem);background:rgba(255,252,247,.82);
  border:1px solid rgba(194,163,107,.5);border-radius:28px;box-shadow:0 26px 60px -30px rgba(110,60,70,.4)}
.panel::before{content:"";position:absolute;inset:8px;border:1px solid rgba(194,163,107,.28);border-radius:20px;pointer-events:none}
h1{font-family:var(--serif);font-weight:500;line-height:1.15;font-size:clamp(1.95rem,7.4vw,2.9rem);text-wrap:balance;color:var(--ink)}
.msg{font-size:1.0625rem;line-height:1.75;margin-top:1.3rem;color:#4A3638}
.msg + .msg{margin-top:1rem}
.emblem{width:46px;height:46px;color:var(--rose);margin-bottom:1rem}

/* buttons */
.nav{display:flex;flex-direction:column;align-items:center;gap:.75rem;margin-top:2rem}
.btn{display:inline-flex;align-items:center;justify-content:center;width:min(100%,20rem);min-height:54px;padding:0 1.8rem;border-radius:99px;
  font:500 1rem var(--sans);letter-spacing:.02em;cursor:pointer;transition:transform .25s ease,background-color .25s ease,box-shadow .25s ease}
.btn.primary{background:var(--rose-deep);color:#FFF9F3;border:0;box-shadow:0 12px 24px -12px rgba(138,68,85,.7)}
.btn.ghost{background:transparent;color:var(--rose-deep);border:1px solid rgba(138,68,85,.4);min-height:48px}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.7;cursor:default}
@media (hover:hover){.btn.primary:hover{background:#9C5266;transform:translateY(-2px);box-shadow:0 16px 28px -12px rgba(138,68,85,.75)}.btn.ghost:hover{background:rgba(243,221,217,.5)}}

/* closed card */
.card-wrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:1.6rem}
.card-scene{perspective:1400px;animation:bob 6s ease-in-out infinite}
.card-scene.opened{animation:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);transform-style:preserve-3d;transition:transform 1.5s ease}
.card.open{transform:scale(1.04)}
.card.reset,.card.reset *{transition:none!important}
.card-inside{position:absolute;inset:0;border-radius:6px 18px 18px 6px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(90deg,rgba(120,70,80,.14),transparent 14%),linear-gradient(160deg,#FFFDF9,#F6EADC);
  box-shadow:0 34px 60px -28px rgba(100,55,65,.5),inset 0 0 0 1px rgba(194,163,107,.5)}
.inside-stack{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%}
.card-inside .emblem-ring{width:68%;height:auto}
.inside-emoji{margin-top:.5rem;font-size:calc(var(--cw)*.085);letter-spacing:.35em;padding-left:.35em;line-height:1}
.inside-date{margin-top:.7rem;font-family:var(--serif);font-style:italic;font-weight:500;font-size:calc(var(--cw)*.062);color:var(--gold-text)}
.card-cover{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transform:translateZ(1px) rotateY(0);
  border-radius:6px 18px 18px 6px;transition:transform 1.5s cubic-bezier(.6,.05,.25,1),opacity .5s ease 1.1s}
.card.open .card-cover{transform:translateZ(1px) rotateY(-168deg);opacity:0}
.face{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16% 11% 15%;
  background:linear-gradient(160deg,#FFFDF9,#F8EFE3);box-shadow:0 34px 60px -28px rgba(100,55,65,.5),inset 0 0 0 1px rgba(194,163,107,.6);overflow:hidden}
.face.front::before{content:"";position:absolute;inset:12px;border:1px solid rgba(194,163,107,.7);border-radius:12px;pointer-events:none}
.face.front::after{content:"";position:absolute;inset:17px;border:1px solid rgba(194,163,107,.3);border-radius:9px;pointer-events:none}
.face.back{transform:rotateY(180deg);background:linear-gradient(200deg,#F8EFE3,#EBD9C8)}
.cover-title{font-style:italic;font-size:calc(var(--cw)*.098);line-height:1.18;position:relative;z-index:1}
.rule{width:44px;height:1px;background:var(--gold);margin:1rem auto .9rem;position:relative;z-index:1}
.cover-to{font-family:var(--serif);font-weight:600;font-size:calc(var(--cw)*.066);color:var(--rose-deep);position:relative;z-index:1}
.cover-from{position:absolute;left:0;right:0;bottom:11%;font-size:max(.8125rem,calc(var(--cw)*.042));letter-spacing:.08em;color:var(--gold-text);z-index:1}
.corner{position:absolute;width:36%;color:var(--rose);opacity:.8;pointer-events:none}
.corner.tr{top:3%;right:3%;transform:rotate(180deg)}
.corner.bl{bottom:3%;left:3%}

/* photos */
.photo{display:block;width:clamp(96px,28vw,132px);aspect-ratio:1;border-radius:50%;object-fit:cover;margin:0 auto 1.2rem;
  border:3px solid #fff;box-shadow:0 0 0 1px var(--gold),0 14px 28px -14px rgba(100,55,65,.5)}
.photo.small{width:88px;margin-bottom:.9rem}
.photo.large{width:62%;margin:0}
.ph{display:grid;place-items:center;text-align:center;border:2px dashed var(--gold);background:rgba(255,252,247,.7);box-shadow:none;padding:10px;
  color:var(--gold-text);font-size:.8125rem;line-height:1.3}

/* screen specifics */
.deco{position:absolute;z-index:0;width:min(34vw,170px);color:var(--rose);opacity:.7;pointer-events:none;transform-origin:50% 100%;animation:sway 7s ease-in-out infinite}
.deco.l{left:max(-10px,calc(50% - 22rem));bottom:6%}
.deco.r{right:max(-10px,calc(50% - 22rem));top:12%;transform:rotate(180deg);animation-name:sway2}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes sway2{0%,100%{transform:rotate(177deg)}50%{transform:rotate(184deg)}}
.quote-mark{font-family:var(--serif);font-size:7rem;line-height:.6;height:3.2rem;color:var(--gold);display:block;margin-bottom:.4rem}
.quote{position:relative;padding:1.6rem 0;margin:0}
.quote::before,.quote::after{content:"";display:block;width:64px;height:1px;background:var(--gold);margin:0 auto}
.quote::before{margin-bottom:1.5rem}.quote::after{margin-top:1.5rem}
.quote p{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(1.5rem,5.8vw,2.15rem);line-height:1.3;text-wrap:balance}
.quote p + p{margin-top:.9rem;color:var(--rose-deep)}
.glow::before{content:"";position:absolute;inset:-18% -14%;z-index:-1;background:radial-gradient(closest-side,rgba(226,196,140,.4),transparent 72%);animation:glow 8s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
.final h1{font-size:clamp(2.1rem,8vw,3.2rem)}
.respect{margin-top:2rem;font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--gold-text)}
.signature{margin:.6rem 0 0;line-height:1.1;color:var(--rose-deep)}
.signature .ink{display:inline-block;font-family:var(--script);font-size:clamp(3rem,13vw,4.4rem);padding:.06em .12em;
  clip-path:inset(-15% 100% -15% -5%);transition:clip-path 2.4s cubic-bezier(.4,.1,.2,1) 1.5s}
.signature img.ink{max-width:min(78%,300px);height:auto}
.is-active .signature .ink{clip-path:inset(-15% -5% -15% -5%)}
.role{font-size:.9375rem;letter-spacing:.08em;color:var(--gold-text);margin-top:.2rem}
.footer-line{margin-top:1.6rem;font-family:var(--serif);font-style:italic;font-size:1.05rem;color:#6A5558}
.final .nav{margin-top:1.8rem}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .petals,.spark{display:none}
  .rise{opacity:1;transform:none}
}
</style>
</head>
<body data-screen="0">

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="flower" viewBox="-50 -50 100 100">
      <g fill="currentColor" fill-opacity=".72" stroke="#fff" stroke-opacity=".7" stroke-width="1">
        <ellipse cx="0" cy="-23" rx="11" ry="21"/>
        <ellipse cx="0" cy="-23" rx="11" ry="21" transform="rotate(60)"/>
        <ellipse cx="0" cy="-23" rx="11" ry="21" transform="rotate(120)"/>
        <ellipse cx="0" cy="-23" rx="11" ry="21" transform="rotate(180)"/>
        <ellipse cx="0" cy="-23" rx="11" ry="21" transform="rotate(240)"/>
        <ellipse cx="0" cy="-23" rx="11" ry="21" transform="rotate(300)"/>
      </g>
      <circle r="7" fill="#C2A36B"/><circle r="3" fill="#FFF3DC"/>
    </symbol>
    <symbol id="sprig" viewBox="0 0 160 160">
      <path d="M10 150 C40 110 70 80 140 20" fill="none" stroke="#C2A36B" stroke-width="1.5" stroke-linecap="round"/>
      <g fill="#B9A27A" fill-opacity=".6">
        <ellipse cx="33" cy="121" rx="15" ry="6" transform="rotate(-55 33 121)"/>
        <ellipse cx="48" cy="104" rx="13" ry="5" transform="rotate(35 48 104)"/>
        <ellipse cx="94" cy="60" rx="15" ry="6" transform="rotate(-35 94 60)"/>
        <ellipse cx="108" cy="46" rx="12" ry="5" transform="rotate(50 108 46)"/>
      </g>
      <use href="#flower" x="114" y="4" width="42" height="42"/>
      <use href="#flower" x="52" y="72" width="28" height="28"/>
    </symbol>
    <symbol id="star" viewBox="0 0 16 16"><path d="M8 0 9.6 6.4 16 8 9.6 9.6 8 16 6.4 9.6 0 8 6.4 6.4Z" fill="#C2A36B"/></symbol>
  </defs>
</svg>

<div class="petals" id="petals" aria-hidden="true"></div>
<div class="petals extra" id="petalsExtra" aria-hidden="true"></div>

<header class="topbar">
  <div class="progress" id="progress" role="img" aria-label="Screen 1 of 6">
    <span class="dots" id="dots" aria-hidden="true"></span>
    <span id="count" aria-hidden="true">1 / 6</span>
  </div>
  <button class="music" id="music" type="button" aria-pressed="false" hidden>♪ Music Off</button>
</header>

<main id="stage"></main>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>
<noscript><p style="padding:2rem;text-align:center">This card needs JavaScript to open. Please enable it and reload.</p></noscript>

<script>
/* ============================================================
   EDIT HERE — every word, photo, signature and sound lives in
   this one CONFIG block. Nothing else needs to be touched.
   ============================================================ */
const CONFIG = {
  teacher: "Ma’am Aysha Bibi",
  student: "Maria Bushra",

  /* Photos: put an image address (or a data: URL) in `src`.
     Leave it empty to hide that photo. Set showPlaceholders to true
     to preview the labelled spots where photos will go. */
  showPlaceholders: false,
  photos: {
    cardTeacher:         { src: "", alt: "Ma’am Aysha Bibi",             label: "teacher-photo-placeholder" },
    appreciationTeacher: { src: "", alt: "Ma’am Aysha Bibi",             label: "teacher-photo-placeholder" },
    finalStudent:        { src: "", alt: "Maria Bushra, your student",    label: "student-photo-placeholder" }
  },

  /* Shown inside the card when it opens (used when there is no teacher photo). */
  cardEmojis: "📚 ✏️ 💡 🎓",
  date: "5 October 2026",

  /* Letter shown inside the floral emblem when there is no teacher photo. */
  monogram: "A",

  /* Handwritten signature image (transparent PNG). Empty = elegant text signature. */
  signatureImage: "",

  /* Background music. Empty = no music and no Music button. Never autoplays. */
  music: { src: "" },

  cover: {
    title: "A Little Something For A Wonderful Teacher",
    to: "For Ma’am Aysha Bibi",
    from: "From Maria Bushra",
    open: "Open Your Card ✨"
  },
  back: "← Back",
  greeting: {
    heading: ["Happy Teachers’ Day", "to My Favorite Ma’am,", "Aysha Bibi 🤍"],
    message: "Some teachers teach lessons from books, but a few leave lessons in our hearts. Thank you for your patience, kindness, guidance, and for making learning feel meaningful.",
    next: "There’s More →"
  },
  appreciation: {
    heading: "A Teacher Like You Is Truly Special",
    message: "Your words, your guidance, and even the little things you do can make a much bigger difference than you may realize. Thank you for being a teacher who inspires respect, learning, and confidence.",
    next: "One More Thing ✨"
  },
  thanks: {
    heading: "Thank You, Ma’am 🤍",
    message: "Thank you for every lesson, every explanation, every correction, and every moment you encouraged your students to do better. Your efforts are appreciated more than words can say.",
    next: "Keep Going →"
  },
  special: {
    screenReaderTitle: "A Special Message",
    quote: ["Some teachers are remembered for what they taught.", "The best teachers are remembered for how they made their students feel."],
    blessing: "May Allah bless you with happiness, success, peace, good health, and countless beautiful moments. May your efforts always bring you reward and respect.",
    next: "Final Message 🤍"
  },
  final: {
    heading: "Happy Teachers’ Day, Ma’am Aysha Bibi 🌷",
    message: [
      "Thank you for being more than just a teacher. Thank you for being someone whose guidance and presence can make a difference. I’m truly grateful to have been your student.",
      "May Allah always keep you happy, respected, successful, and surrounded by goodness. Ameen. 🤍"
    ],
    closing: "With Respect & Best Wishes",
    signatureName: "Maria Bushra",
    role: "Your Student",
    footer: "Made with respect and gratitude.",
    again: "Read Again ↺"
  }
};

/* ===================== components ===================== */
const TOTAL = 6;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br = a => a.map(esc).join('<br>');
const clean = s => s.replace(/[→←↺✨🤍🌷]/gu, '').trim();
const d = ms => `style="--d:${ms}ms"`;

function PhotoSlot(key, cls = '', rise = true) {
  const p = CONFIG.photos[key];
  const r = rise ? ' rise' : '';
  if (p.src) return `<img class="photo ${cls}${r}" ${rise ? d(200) : ''} src="${esc(p.src)}" alt="${esc(p.alt)}" loading="lazy" decoding="async" width="132" height="132">`;
  if (CONFIG.showPlaceholders) return `<div class="photo ph ${cls}${r}" ${rise ? d(200) : ''} id="${p.label}-${key}" role="img" aria-label="Placeholder: replace with a photo"><span>${esc(p.label)}</span></div>`;
  return '';
}

function Flower(cls = 'emblem rise', delay = 0) {
  return `<svg class="${cls}" ${d(delay)} viewBox="-50 -50 100 100" aria-hidden="true"><use href="#flower"/></svg>`;
}

function NavigationButtons(i, nextLabel, opts = {}) {
  const next = opts.again
    ? `<button class="btn primary" type="button" data-go="0" aria-label="Read again, return to the first screen">${esc(nextLabel)}</button>`
    : `<button class="btn primary" type="button" data-go="${i + 1}" aria-label="${esc(clean(nextLabel))}, go to the next screen">${esc(nextLabel)}</button>`;
  const back = `<button class="btn ghost" type="button" data-go="${i - 1}" aria-label="Back to the previous screen">${esc(CONFIG.back)}</button>`;
  return `<div class="nav rise" ${d(opts.delay || 850)}>${next}${back}</div>`;
}

function Emblem() {
  let w = '';
  for (let k = 0; k < 12; k++) {
    const a = k * 30, big = k % 2 === 0, s = big ? 26 : 18;
    w += `<ellipse cx="0" cy="-88" rx="11" ry="4" fill="#B9A27A" fill-opacity=".6" transform="rotate(${a + 15})"/>`;
    w += `<g transform="rotate(${a}) translate(0,-88)"><use href="#flower" x="${-s/2}" y="${-s/2}" width="${s}" height="${s}" style="color:${big ? '#B87682' : '#D9A3AB'}"/></g>`;
  }
  return `<svg class="emblem-ring" viewBox="-106 -106 212 212" aria-hidden="true">
    <circle r="74" fill="#FFFCF7" stroke="#C2A36B" stroke-width="1.5"/>
    <circle r="67" fill="none" stroke="#C2A36B" stroke-opacity=".45"/>
    ${w}
    <text x="0" y="28" text-anchor="middle" style="font-family:var(--serif);font-weight:600" font-size="92" fill="#8A4455">${esc(CONFIG.monogram)}</text>
  </svg>`;
}

function GreetingCard() {
  const c = CONFIG.cover;
  const inside = CONFIG.photos.cardTeacher.src || CONFIG.showPlaceholders
    ? PhotoSlot('cardTeacher', 'large', false)
    : `<div class="inside-stack">${Emblem()}<p class="inside-emoji" aria-hidden="true">${esc(CONFIG.cardEmojis)}</p><p class="inside-date">Teachers’ Day, ${esc(CONFIG.date)}</p></div>`;
  return `
  <section class="screen" id="s0" aria-labelledby="t0">
    <div class="card-wrap">
      <div class="card-scene" id="scene">
        <div class="card" id="card">
          <div class="card-inside" aria-hidden="true">${inside}</div>
          <div class="card-cover">
            <div class="face front">
              <svg class="corner tr" viewBox="0 0 160 160" aria-hidden="true"><use href="#sprig"/></svg>
              <svg class="corner bl" viewBox="0 0 160 160" aria-hidden="true"><use href="#sprig"/></svg>
              <h1 class="cover-title" id="t0" tabindex="-1">${esc(c.title)}</h1>
              <div class="rule" aria-hidden="true"></div>
              <p class="cover-to">${esc(c.to)}</p>
              <p class="cover-from">${esc(c.from)}</p>
            </div>
            <div class="face back"></div>
          </div>
        </div>
      </div>
      <button class="btn primary" type="button" id="openBtn">${esc(c.open)}</button>
    </div>
  </section>`;
}

function GreetingScreen() {
  const g = CONFIG.greeting;
  return `
  <section class="screen" id="s1" aria-labelledby="t1"><div class="inner">
    <div class="panel">
      ${Flower('emblem rise', 100)}
      <h1 class="rise" ${d(250)} id="t1" tabindex="-1">${br(g.heading)}</h1>
      <p class="msg rise" ${d(600)}>${esc(g.message)}</p>
      ${NavigationButtons(1, g.next, { delay: 950 })}
    </div></div></section>`;
}

function AppreciationScreen() {
  const a = CONFIG.appreciation;
  return `
  <section class="screen" id="s2" aria-labelledby="t2">
    <svg class="deco l" viewBox="0 0 160 160" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="deco r" viewBox="0 0 160 160" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="inner"><div class="panel">
      ${PhotoSlot('appreciationTeacher')}
      <h1 class="rise" ${d(250)} id="t2" tabindex="-1">${esc(a.heading)}</h1>
      <p class="msg rise" ${d(600)}>${esc(a.message)}</p>
      ${NavigationButtons(2, a.next, { delay: 950 })}
    </div></div></section>`;
}

function ThankYouScreen() {
  const t = CONFIG.thanks;
  return `
  <section class="screen" id="s3" aria-labelledby="t3"><div class="inner"><div class="panel">
    <span class="quote-mark rise" ${d(100)} aria-hidden="true">“</span>
    <h1 class="rise" ${d(300)} id="t3" tabindex="-1">${esc(t.heading)}</h1>
    <p class="msg rise" ${d(650)}>${esc(t.message)}</p>
    ${NavigationButtons(3, t.next, { delay: 1000 })}
  </div></div></section>`;
}

function SpecialMessageScreen() {
  const s = CONFIG.special;
  return `
  <section class="screen" id="s4" aria-labelledby="t4"><div class="inner">
    <h1 class="sr-only" id="t4" tabindex="-1">${esc(s.screenReaderTitle)}</h1>
    <blockquote class="quote rise" ${d(150)}>${s.quote.map(l => `<p>${esc(l)}</p>`).join('')}</blockquote>
    <p class="msg rise" ${d(900)}>${esc(s.blessing)}</p>
    ${NavigationButtons(4, s.next, { delay: 1400 })}
  </div></section>`;
}

function Signature() {
  const f = CONFIG.final;
  const ink = CONFIG.signatureImage
    ? `<img class="ink" src="${esc(CONFIG.signatureImage)}" alt="Handwritten signature of ${esc(f.signatureName)}" decoding="async">`
    : `<span class="ink" aria-hidden="true">${esc(f.signatureName)}</span>`;
  return `
    <p class="respect rise" ${d(1000)}>${esc(f.closing)}</p>
    ${PhotoSlot('finalStudent', 'small')}
    <div class="signature" ${CONFIG.signatureImage ? '' : `role="img" aria-label="Signature: ${esc(f.signatureName)}"`}>${ink}</div>
    <p class="role rise" ${d(3200)}>${esc(f.role)}</p>`;
}

function FinalReveal() {
  const f = CONFIG.final;
  return `
  <section class="screen final" id="s5" aria-labelledby="t5"><div class="inner glow">
    <svg class="deco l" viewBox="0 0 160 160" aria-hidden="true"><use href="#sprig"/></svg>
    <svg class="deco r" viewBox="0 0 160 160" aria-hidden="true"><use href="#sprig"/></svg>
    <div class="panel" style="background:rgba(255,252,247,.86)">
      <h1 class="rise" ${d(250)} id="t5" tabindex="-1">${esc(f.heading)}</h1>
      ${f.message.map((m, k) => `<p class="msg rise" ${d(600 + k * 250)}>${esc(m)}</p>`).join('')}
      ${Signature()}
      <p class="footer-line rise" ${d(3500)}>${esc(f.footer)}</p>
      ${NavigationButtons(5, f.again, { again: true, delay: 3800 })}
    </div></div></section>`;
}

function ProgressIndicator() {
  const dots = document.getElementById('dots');
  dots.innerHTML = Array.from({ length: TOTAL }, () => '<i></i>').join('');
  return n => {
    [...dots.children].forEach((el, k) => el.classList.toggle('on', k === n));
    document.getElementById('count').textContent = `${n + 1} / ${TOTAL}`;
    document.getElementById('progress').setAttribute('aria-label', `Screen ${n + 1} of ${TOTAL}`);
  };
}

function MusicToggle() {
  if (!CONFIG.music.src) return;
  const btn = document.getElementById('music');
  const audio = new Audio();
  audio.src = CONFIG.music.src; audio.loop = true; audio.preload = 'none';
  const set = on => { btn.setAttribute('aria-pressed', on); btn.textContent = on ? '♪ Music On' : '♪ Music Off'; };
  btn.hidden = false;
  btn.addEventListener('click', () => {
    if (audio.paused) audio.play().then(() => set(true)).catch(() => set(false));
    else { audio.pause(); set(false); }
  });
}

/* ===================== behaviour ===================== */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
stage.innerHTML = GreetingCard() + GreetingScreen() + AppreciationScreen() + ThankYouScreen() + SpecialMessageScreen() + FinalReveal();
const screens = [...stage.querySelectorAll('.screen')];
const setProgress = ProgressIndicator();
MusicToggle();

let cur = 0, busy = false;
const card = document.getElementById('card');
const scene = document.getElementById('scene');
const openBtn = document.getElementById('openBtn');

function resetCard() {
  card.classList.add('reset');
  card.classList.remove('open'); scene.classList.remove('opened');
  void card.offsetWidth;
  card.classList.remove('reset');
  openBtn.disabled = false;
}

function go(n) {
  if (busy || n === cur || n < 0 || n >= TOTAL) return;
  busy = true;
  if (n === 0) resetCard();
  screens[cur].classList.remove('is-active');
  screens[n].classList.add('is-active');
  cur = n;
  document.body.dataset.screen = n;
  setProgress(n);
  setTimeout(() => {
    const h = screens[n].querySelector('h1');
    h.focus({ preventScroll: true });
    screens[n].scrollTop = 0;
    document.getElementById('live').textContent = `Screen ${n + 1} of ${TOTAL}: ${h.textContent.replace(/\s+/g, ' ').trim()}`;
    busy = false;
  }, RM ? 50 : 650);
}

stage.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (b) go(+b.dataset.go);
});

openBtn.addEventListener('click', () => {
  if (busy) return;
  openBtn.disabled = true;
  scene.classList.add('opened');
  card.classList.add('open');
  setTimeout(() => go(1), RM ? 250 : 1900);
});

/* first paint first, decoration after */
requestAnimationFrame(() => { screens[0].classList.add('is-active'); setProgress(0); });

setTimeout(() => {
  const rand = (a, b) => (Math.random() * (b - a) + a).toFixed(2);
  const mk = (box, n) => { for (let i = 0; i < n; i++) {
    const e = document.createElement('i'); e.className = 'petal';
    e.style.cssText = `--x:${rand(0,98)}vw;--s:${rand(10,18)}px;--dur:${rand(18,30)}s;--del:-${rand(0,30)}s;--sway:${rand(-45,45)}px;--o:${rand(.4,.7)}`;
    box.append(e); } };
  mk(document.getElementById('petals'), 9);
  const extra = document.getElementById('petalsExtra');
  mk(extra, 11);
  for (let i = 0; i < 8; i++) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', 'spark'); s.setAttribute('viewBox', '0 0 16 16');
    s.style.cssText = `--x:${rand(5,92)}%;--y:${rand(8,88)}%;--s:${rand(12,20)}px;--dur:${rand(4,7)}s;--del:-${rand(0,6)}s`;
    s.innerHTML = '<use href="#star"/>'; extra.append(s);
  }
}, 500);
</script>
</body>
